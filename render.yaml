services:
  - type: web
    name: first-light
    runtime: python
    plan: starter
    # DB migrations/seed must run at RUNTIME (start), not at build: Render's
    # internal database hostname only resolves once the service is running.
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && python seed.py && gunicorn "app:create_app()" --workers 2 --threads 4 --timeout 300
    healthCheckPath: /healthz
    # A persistent disk for uploaded files. Without one, the paths below are
    # ordinary container storage: they work until the next deploy and then
    # come back empty, taking every uploaded file with them. If this disk is
    # not attached to the live service, clear COURSE_FILES_DIR (and the other
    # two paths) so files are kept in Postgres instead, which survives — at a
    # much smaller size per file.
    disk:
      name: media
      mountPath: /var/media
      sizeGB: 25
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      # Where uploaded videos are stored (on the mounted disk above).
      - key: VIDEO_STORAGE_DIR
        value: /var/media/videos
      # Per-video upload cap in MB (checkout the disk size before raising).
      # Cloudflare Free proxies reject bodies over ~100 MB — keep Studio
      # uploads under that unless the upload host bypasses the proxy.
      - key: MAX_VIDEO_MB
        value: "95"
      - key: REEL_RAW_MAX_MB
        value: "90"
      # Course module content (lesson videos, worksheets) on the media disk,
      # not in Postgres. Studio sends big files up in slices, so this cap is
      # not bound by Cloudflare's ~100 MB request body limit — COURSE_CHUNK_MB
      # is what has to stay under it.
      - key: COURSE_FILES_DIR
        value: /var/media/course_files
      - key: COURSE_UPLOAD_MAX_MB
        value: "2048"
      - key: COURSE_CHUNK_MB
        value: "8"
      - key: FLASK_APP
        value: "app:create_app"
      - key: DATABASE_URL
        fromDatabase:
          name: first-light-db
          property: connectionString
      # Email (required): Brevo HTTP API + verified sender.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Cloudflare Turnstile on signup only (optional until keys are set).
      - key: TURNSTILE_SITE_KEY
        value: 0x4AAAAAAEAGFowmHgyFM5Kf
      - key: TURNSTILE_SECRET
        sync: false
      # Stripe (courses, guides, memberships).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional self-hosted shop download files (default: instance/shop_files).
      # Prefer the media disk, e.g. /var/media/shop_files
      - key: SHOP_FILES_DIR
        value: /var/media/shop_files
      # Optional: shared secret for /cron/support-groups (24h reminders).
      - key: CRON_SECRET
        sync: false
      # Daily.co (embedded support-group rooms).
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_MEETING_DURATION
        value: "30"

databases:
  - name: first-light-db
    plan: basic-256mb
